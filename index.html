<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#236441" />
    <title>Еда рядом</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #e9eee4;
        color: #20372c;
        font:
          15px/1.4 system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 58px;
        width: min(100%, 800px);
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 16px;
      }
      strong {
        font-size: 19px;
        letter-spacing: -0.6px;
      }
      nav {
        display: flex;
        gap: 6px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 24px;
        min-height: 42px;
        padding: 9px 16px;
        background: #f5f7f2;
        color: #20372c;
      }
      button[aria-pressed='true'] {
        background: #236441;
        color: #fff;
      }
      button:focus-visible {
        outline: 3px solid #d09b31;
        outline-offset: 2px;
      }
      main {
        flex: 1;
        min-height: 0;
        width: min(100%, 800px);
        margin: 0 auto;
        background: #f5f7f2;
        border-radius: 24px 24px 0 0;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
        background: #f5f7f2;
      }
      @media (max-width: 600px) {
        header {
          padding: 7px 12px;
        }
        strong {
          font-size: 17px;
        }
        button {
          font-size: 13px;
          padding: 9px 13px;
        }
        main {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Еда рядом</strong>
      <nav aria-label="Режим просмотра">
        <button id="customer" aria-pressed="true">Покупатель</button
        ><button id="partner" aria-pressed="false">Заведение</button>
      </nav>
    </header>
    <main>
      <iframe
        id="app"
        src="customer/?v=1793518966271"
        title="Приложение покупателя"
        allow="geolocation; camera"
      ></iframe>
    </main>
    <script>
      const app = document.getElementById('app');
      const build = '1793518966271';
      for (const name of ['customer', 'partner'])
        document.getElementById(name).onclick = () => {
          for (const id of ['customer', 'partner'])
            document.getElementById(id).setAttribute('aria-pressed', String(id === name));
          app.src = name + '/?v=' + build;
          app.title = name === 'customer' ? 'Приложение покупателя' : 'Приложение заведения';
        };
    </script>
  </body>
</html>
